<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(to right, #336195, #FFDE59);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
    background: linear-gradient(to right, #336195, #FFDE59);
    }
    .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .links a {
      color: #0c00ec;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .messages {
      margin-bottom: 15px;
      font-size: 14px;
      text-align: center;
    }
    .messages .success { color: green; }
    .messages .error { color: red; }
    .messages .info { color: #2563eb; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>

    <!-- mensagens flash -->
    <div class="messages">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="links">
      <p><a href="{{ url_for('cadastro') }}">Criar conta</a></p>
      <p><a href="{{ url_for('esqueciSenha') }}">Recuperar senha</a></p>
    </div>
  </div>
</body>
</html>
